plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group = 'io.github.mosadie.exponentialpower'
base {
    archivesName = "ExponentialPower-${mc_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main.resources { srcDir 'src/generated/resources' }
    // Testes de integracao com Mekanism e Draconic Evolution (comando /eptest). Nao entram no jar.
    eptest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    eptestImplementation.extendsFrom implementation
    eptestImplementation.extendsFrom minecraft
}

minecraft {
    mappings channel: 'official', version: mc_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'exponentialpower'
            // Mods de outros autores (Mekanism, Draconic) trazem refmaps em nomes SRG; no ambiente de
            // desenvolvimento eles precisam ser traduzidos para os nomes oficiais.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                exponentialpower {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        // Servidor com Mekanism, Draconic Evolution e o mod de teste /eptest.
        testServer {
            parent runs.server
            args '--nogui'
            mods {
                eptest {
                    source sourceSets.eptest
                }
            }
        }

        data {
            args '--mod', 'exponentialpower', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    maven { url = 'https://modmaven.dev/' }               // Mekanism
    maven { url = 'https://maven.covers1624.net/' }       // Draconic Evolution, BrandonsCore, CodeChickenLib
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // Mods usados nos testes de integracao. runtimeOnly: ficam no classpath das execucoes de
    // desenvolvimento (runServer/runTestServer), mas nunca no jar nem como dependencia do mod.
    def modsDeTeste = [
            "mekanism:Mekanism:${mekanism_version}",
            "com.brandon3055.draconicevolution:Draconic-Evolution:${draconic_version}:universal",
            "com.brandon3055.brandonscore:BrandonsCore:${brandonscore_version}:universal",
            "io.codechicken:CodeChickenLib:${ccl_version}:universal",
    ]
    modsDeTeste.each {
        runtimeOnly fg.deobf(it)
        eptestCompileOnly fg.deobf(it)
    }
}

tasks.matching { it.name == 'runTestServer' }.configureEach {
    standardInput = System.in
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "ExponentialPower",
            "Specification-Vendor"    : "MoSadie",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "MoSadie (porte 1.20.1: Liesel007)",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    // A licenca LGPL-3.0 vai dentro do jar.
    from('LICENSE.txt') { rename { 'LICENSE_ExponentialPower.txt' } }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
