plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file(System.getenv('HLO_SO_HLO') ? 'run_so_hlo' : 'run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.verbose', 'true'
            // Mods de terceiros (libs_teste) trazem refmaps em nomes SRG; em dev precisam ser convertidos.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // Teste do modo seguro: HLO_FALHAR=<modulo> faz o modulo lancar excecao nos pontos de entrada.
            if (System.getenv('HLO_FALHAR')) {
                property 'hlotimizacao.teste.falhar', System.getenv('HLO_FALHAR')
            }
            // Idioma do Java para o teste do log.idioma=auto: HLO_IDIOMA=pt
            if (System.getenv('HLO_IDIOMA')) {
                jvmArgs '-Duser.language=' + System.getenv('HLO_IDIOMA')
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // Jars de outros mods usados so nos testes (nao vao para o git): libs_teste/<nome>-<versao>.jar
    flatDir { dirs 'libs_teste' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Permite mandar comandos (ex.: "stop") para o servidor de teste pelo terminal.
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

// Licenca MIT dentro do jar.
tasks.named('jar') {
    from(rootProject.file('../LICENSE')) {
        rename { 'LICENSE_hlotimizacao' }
    }
}
